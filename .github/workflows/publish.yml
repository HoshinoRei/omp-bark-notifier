name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # 24.04 is the latest GA runner image; the ubuntu-26.04 label is still preview (no SLA).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Set up Node.js for npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # node-version 24 = current Active LTS ("Krypton"); 22 is Maintenance LTS.
          # registry-url is not cosmetic: it writes the project .npmrc that maps
          # NODE_AUTH_TOKEN to registry.npmjs.org; without it npm publish gets a 401.

      # The release tag is the single source of truth for the published version.
      # Draft/pre-release tags are semver-parsed the same way; `--allow-same-version`
      # keeps an already-matching package.json from failing the step.
      - name: Align package.json version with the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version

      # No build step and no lifecycle scripts, so nothing needs installing here:
      # npm publish packs the working tree as checked out from the tag.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Secret is named NPM_TOKEN in the repo; the env var must stay NODE_AUTH_TOKEN
      # because setup-node's generated .npmrc references ${NODE_AUTH_TOKEN}.
